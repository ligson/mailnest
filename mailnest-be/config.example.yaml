server:
  host: "127.0.0.1"
  port: 8080

app:
  dataDir: "./data"
  allowRegistration: true
  jwtSecret: "change-me-in-production"
  jwtExpireHours: 168
  credentialSecret: "change-me-32-byte-secret-value"

database:
  # driver 支持 sqlite、mysql、postgres；不配置时默认 sqlite。
  driver: "sqlite"
  # sqlite 使用 path；mysql/postgres 使用 dsn。
  path: "./data/mailnest.db"
  dsn: ""
  maxOpenConns: 4
  maxIdleConns: 4

search:
  # database 保持兼容搜索；bleve 启用本地可重建索引，无需额外搜索服务。
  engine: "database"
  # 首次启用 bleve 建议 shadow（只验证，不改变搜索结果）；核对通过后切换 active。
  mode: "shadow"
  # 空值使用 app.dataDir/search，必须位于持久化磁盘，且只允许一个后端写进程。
  path: ""
  batchSize: 25
  batchDelayMs: 50
  # 过于宽泛的搜索回退数据库，不截断结果。上限 50000。
  maxCandidates: 20000

oauth:
  microsoft:
    tenant: "consumers"
    clientId: ""
    clientSecret: ""
    redirectUrl: "http://127.0.0.1:5173/oauth/microsoft/callback"
